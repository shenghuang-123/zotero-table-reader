<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Zotero Table Reader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FB35F"/>
      <stop offset="1" stop-color="#146C38"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="24" y="26" width="80" height="76" rx="11"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- sheet shadow -->
  <rect x="27" y="30" width="80" height="76" rx="11" fill="#0A3D20" opacity="0.28"/>
  <!-- sheet -->
  <rect x="24" y="26" width="80" height="76" rx="11" fill="#FFFFFF"/>

  <g clip-path="url(#card)">
    <!-- header band -->
    <rect x="24" y="26" width="80" height="20" fill="#1B8A4A"/>
    <!-- merged cell: spans two columns -->
    <rect x="24" y="46" width="53.4" height="18" fill="#D8F3E2"/>
    <!-- grid lines -->
    <g stroke="#1B8A4A" stroke-width="2" opacity="0.85">
      <line x1="77.4" y1="46" x2="77.4" y2="102"/>
      <line x1="50.7" y1="64" x2="50.7" y2="102"/>
      <line x1="24" y1="64" x2="104" y2="64"/>
      <line x1="24" y1="82" x2="104" y2="82"/>
    </g>
    <!-- cell content hints -->
    <g fill="#8FD8AC">
      <rect x="29" y="72" width="14" height="4" rx="2"/>
      <rect x="29" y="90" width="16" height="4" rx="2"/>
      <rect x="56" y="72" width="15" height="4" rx="2"/>
      <rect x="56" y="90" width="12" height="4" rx="2"/>
    </g>
    <g fill="#FFFFFF" opacity="0.6">
      <rect x="31" y="33" width="16" height="5" rx="2.5"/>
      <rect x="57" y="33" width="16" height="5" rx="2.5"/>
      <rect x="83" y="33" width="15" height="5" rx="2.5"/>
    </g>
    <g fill="#63C88C">
      <rect x="83" y="53" width="15" height="4" rx="2"/>
      <rect x="83" y="72" width="15" height="4" rx="2"/>
      <rect x="83" y="90" width="15" height="4" rx="2"/>
    </g>
  </g>
</svg>
