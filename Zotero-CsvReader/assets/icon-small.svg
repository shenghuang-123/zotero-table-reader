<?xml version="1.0" encoding="UTF-8"?>
<!-- 16 / 32px 专用：所有坐标对齐 8 单位网格（16px 时 = 1 物理像素），避免小尺寸糊成一团 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33BA63"/>
      <stop offset="1" stop-color="#126334"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="24" y="24" width="80" height="80" rx="8"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect x="24" y="24" width="80" height="80" rx="8" fill="#FFFFFF"/>
  <g clip-path="url(#card)">
    <rect x="24" y="48" width="40" height="24" fill="#D8F3E2"/>
    <rect x="24" y="24" width="80" height="24" fill="#1B8A4A"/>
    <rect x="64" y="48" width="8" height="56" fill="#1B8A4A"/>
    <rect x="24" y="72" width="80" height="8" fill="#1B8A4A"/>
  </g>
</svg>
